  <!-- 脚本 - 按依赖顺序加载 -->
  <script>
    // ===== Service Worker 注册(离线可用 + 可安装 PWA)=====
    // 仅在 http/https 环境下注册;直接 file:// 打开时自动跳过
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').then(function (reg) {
          console.log('SW registered:', reg.scope);
        }).catch(function (err) {
          console.warn('SW register failed(不影响使用):', err.message);
        });
      });
    }
    // ===== PWA 安装引导(桌面/安卓 Chrome 可"添加到主屏幕")=====
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredPrompt = e;
      var el = document.getElementById('install-banner');
      if (el) el.classList.remove('hidden');
    });
    window.__installApp = function () {
      if (window.__deferredPrompt) {
        window.__deferredPrompt.prompt();
        window.__deferredPrompt.userChoice.then(function () {
          window.__deferredPrompt = null;
          var el = document.getElementById('install-banner');
          if (el) el.classList.add('hidden');
        });
      }
    };
    window.__dismissInstall = function () {
      var el = document.getElementById('install-banner');
      if (el) el.classList.add('hidden');
    };
  </script>
  <!-- PWA 安装横幅(移动端底部,可关闭) -->
  <div id="install-banner" class="install-banner hidden">
    <div class="install-banner-inner">
      <div class="install-banner-icon">🌿</div>
      <div class="install-banner-text">
        <div class="install-banner-title">安装「全日健康」</div>
        <div class="install-banner-sub">添加到主屏幕 · 像 App 一样使用</div>
      </div>
      <button class="install-banner-btn" onclick="window.__installApp()">安装</button>
      <button class="install-banner-x" onclick="window.__dismissInstall()">✕</button>
    </div>
  </div>
