<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="三餐指南 - 基于中国居民膳食指南的智能饮食规划工具">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥢</text></svg>">
  <title>三餐指南 - 智能饮食规划</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 启动画面 -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-icon">🥢</div>
      <h1 class="splash-title">三餐指南</h1>
      <p class="splash-subtitle">今天吃什么？已经帮你安排好了</p>
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- 主应用容器 -->
  <div id="app" class="app-wrap hidden">
    <!-- 顶栏 -->
    <div class="app-header">
      <div class="app-title">🥢 三餐指南</div>
      <nav class="app-nav" id="app-nav">
        <a href="#" data-page="home" class="active"><span class="nav-label-full">首页</span><span class="nav-label-short">首页</span></a>
        <a href="#" data-page="plan"><span class="nav-label-full">本周菜单</span><span class="nav-label-short">菜单</span></a>
        <a href="#" data-page="shopping"><span class="nav-label-full">采购清单</span><span class="nav-label-short">采购</span></a>
        <a href="#" data-page="profile"><span class="nav-label-full">设置</span><span class="nav-label-short">设置</span></a>
      </nav>
    </div>

    <!-- 页面内容 -->
    <div id="main-content"></div>

    <!-- 模态框 -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box" id="modal-content"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- 脚本 - 按依赖顺序加载 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
  <script src="js/i18n/zh-CN.js"></script>
  <script src="js/storage/localStore.js"></script>
  <script src="js/storage/cryptoStore.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/engine/nutrition.js"></script>
  <script src="js/engine/dietEngine.js"></script>
  <script src="js/engine/mealPlanner.js"></script>
  <script src="js/components/profileForm.js"></script>
  <script src="js/components/weeklyPlan.js"></script>
  <script src="js/components/recipeCard.js"></script>
  <script src="js/components/shoppingList.js"></script>
  <script src="js/components/homePage.js"></script>
  <script src="js/components/settingsPage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
