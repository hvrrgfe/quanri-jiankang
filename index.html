<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C49A6C">
  <meta name="description" content="全日健康 - 从早到晚，都安排好了">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C49A6C' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M11 2v20M13 2v20'/%3E%3Cpath d='M6 10l3-3M18 10l-3-3'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 启动画面 -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- 主应用容器 -->
  <div id="app" class="app-wrap hidden">
    <!-- 顶栏 -->
    <div class="app-header">
      <div class="app-title">全日健康</div>
      <nav class="app-nav" id="app-nav">
        <a href="#" data-page="home" class="active"><span class="nav-label-full">今天</span><span class="nav-label-short">今天</span></a>
        <a href="#" data-page="plan"><span class="nav-label-full">饮食</span><span class="nav-label-short">饮食</span></a>
        <a href="#" data-page="fitness"><span class="nav-label-full">运动</span><span class="nav-label-short">运动</span></a>
        <a href="#" data-page="shopping"><span class="nav-label-full">采购</span><span class="nav-label-short">采购</span></a>
        <a href="#" data-page="profile"><span class="nav-label-full">通用</span><span class="nav-label-short">通用</span></a>
      </nav>
    </div>

    <!-- 页面内容 -->
    <div id="main-content"></div>

    <!-- 模态框 -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box" id="modal-content"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- 脚本 - 按依赖顺序加载 -->
  <script>
    // 完全禁用 Service Worker（浏览器扩展导致缓存失败）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>
  <script src="js/i18n/zh-CN.js"></script>
  <script src="js/storage/localStore.js"></script>
  <script src="js/storage/cryptoStore.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/data/prices.js"></script>

  <script src="js/components/shoppingList.js"></script>
  <script src="js/components/homePage.js"></script>
